name: Weekly Pulse

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00 UTC (05:30 IST)
  workflow_dispatch:
    inputs:
      product:
        description: 'Product name (e.g. indmoney, groww) or "all"'
        required: false
        default: 'all'
        type: string
      week:
        description: 'Target ISO week (e.g. 2026-W24). Leave empty for current week.'
        required: false
        type: string

jobs:
  run-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Needed to push refreshed data back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Pulse Pipeline
        env:
          GROQ_API: ${{ secrets.GROQ_API_KEY }}
        run: |
          PRODUCT="${{ github.event.inputs.product || 'all' }}"
          WEEK_ARG=""
          
          if [ -n "${{ github.event.inputs.week }}" ]; then
            WEEK_ARG="--week ${{ github.event.inputs.week }}"
          fi
          
          if [ "$PRODUCT" = "all" ]; then
            echo "Running pipeline for ALL products sequentially..."
            # Extract product names from config (requires yq which is available on ubuntu-latest)
            PRODUCTS=$(yq e '.products | keys | .[]' config/products.yaml)
            
            for p in $PRODUCTS; do
              echo "-----------------------------------"
              echo "Starting run for: $p"
              python pulse.py run --product "$p" $WEEK_ARG || echo "Warning: Run failed for $p, continuing to next..."
              # Sleep a bit to respect rate limits between full runs
              sleep 10
            done
          else
            echo "Running pipeline for specific product: $PRODUCT"
            python pulse.py run --product "$PRODUCT" $WEEK_ARG
          fi
          
      - name: Audit History
        run: |
          PRODUCT="${{ github.event.inputs.product || 'all' }}"
          
          echo "=== RUN HISTORY AUDIT ==="
          if [ "$PRODUCT" = "all" ]; then
            PRODUCTS=$(yq e '.products | keys | .[]' config/products.yaml)
            for p in $PRODUCTS; do
              echo "History for $p:"
              python pulse.py history --product "$p" || true
              echo ""
            done
          else
            python pulse.py history --product "$PRODUCT" || true
          fi
          
      - name: Sync reports into frontend data folder
        run: |
          mkdir -p frontend/public/data
          cp -R data/reports/* frontend/public/data/

      - name: Commit and push generated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reports/ frontend/public/data/
          git add run_ledger.db state.db 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "chore: Weekly automated pulse data refresh"
            git push origin main
          else
            echo "No new data to commit."
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-run-artifacts
          path: |
            outbox/
            data/
            state.db
          retention-days: 14
